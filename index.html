<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>卫星星下点轨迹</title>
<style>
  :root{
    --ink:#3a3a3a;
    --muted:#6b6b6b;
    --purple:#6b3fd4;
    --orange:#ef9420;
    --green:#2f7d32;
    --blue:#3a34c9;
    --red:#dc1f26;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);background:#ececec;overflow:hidden;
  }
  #app{display:flex;height:100%;width:100%;background:#fff}

  /* ---------- left ---------- */
  #left{
    flex:1 1 56%;min-width:520px;
    display:flex;flex-direction:column;
    padding:16px 20px 10px;background:#fff;
  }
  h1{
    font-size:19px;font-weight:700;letter-spacing:.6px;color:#3d3d3d;
    text-align:center;margin:2px 0 16px;
  }

  /* controls */
  #controls{display:flex;gap:24px;align-items:flex-start;padding:0 8px 6px}

  .grid{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:16px 34px;padding-top:2px}
  .ctrl .lab{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:12px;color:#4d4d4d;margin-bottom:7px;letter-spacing:.2px;
  }
  .ctrl .val{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:#3a3a3a}
  .ctrl.g .val{color:var(--green)}
  .ctrl.o .val{color:var(--orange)}

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:16px;background:transparent;cursor:pointer;display:block;
  }
  input[type=range]:disabled{cursor:default}
  input[type=range]::-webkit-slider-runnable-track{
    height:3px;border-radius:2px;background:#4a4a4a;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:11px;height:11px;border-radius:50%;background:#3a3a3a;
    margin-top:-4px;box-shadow:0 0 0 1px rgba(0,0,0,.06);
  }
  input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:#4a4a4a}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:#3a3a3a}

  input[type=range].r-green::-webkit-slider-runnable-track{background:var(--green)}
  input[type=range].r-green::-webkit-slider-thumb{background:var(--green)}
  input[type=range].r-green::-moz-range-track{background:var(--green)}
  input[type=range].r-green::-moz-range-thumb{background:var(--green)}

  input[type=range]:disabled::-webkit-slider-runnable-track{background:#d0d0d0}
  input[type=range]:disabled::-webkit-slider-thumb{background:#a8a8a8}
  input[type=range]:disabled::-moz-range-track{background:#d0d0d0}
  input[type=range]:disabled::-moz-range-thumb{background:#a8a8a8}

  /* locate row */
  #locate{display:flex;flex-direction:column;gap:6px;padding:1px 8px 8px}
  .lrow{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center}
  .lgroup{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px}
  .lname{color:#4d4d4d;letter-spacing:.2px}
  .sub{color:#9a9a9a;font-size:11px}
  .unit{color:#4a4a4a;font-size:16px;line-height:1;margin-left:-2px;font-weight:600;align-self:center}
  input.num{
    width:58px;height:22px;border:1px solid #d5d5d5;border-radius:5px;background:#fafafa;
    font-family:inherit;font-size:12px;color:#333;text-align:center;padding:0 2px;
    font-variant-numeric:tabular-nums;
  }
  input.num.t{width:34px;padding:0;font-weight:700;letter-spacing:.5px}
  input.num.ra{width:52px;font-weight:700;letter-spacing:.3px}
  .tsep{color:#9a9a9a;font-weight:700;margin:0 -2px}
  .lgroup.tg{gap:4px}
  input.num:focus{outline:none;border-color:var(--purple);background:#fff;box-shadow:0 0 0 2px rgba(107,63,212,.13)}
  input.num::-webkit-outer-spin-button,
  input.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  button.mini{
    height:22px;padding:0 9px;border:0;border-radius:5px;background:var(--purple);color:#fff;
    font-family:inherit;font-size:11.5px;letter-spacing:.3px;cursor:pointer;
    transition:background .15s,transform .08s;
  }
  button.mini:hover{background:#7a51e2}
  button.mini:active{transform:translateY(1px)}

  /* legend */
  #legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:0 10px 4px;font-size:11px;color:#8c8c8c;letter-spacing:.2px}
  #legend span{display:flex;align-items:center;gap:5px}
  #legend i{display:block;width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  #legend i.red{background:#dc1f26}
  #legend i.dia{background:#fff;border:1.6px solid #ef9420;border-radius:1px;transform:rotate(45deg);width:7px;height:7px}
  #legend i.line{width:14px;height:2px;border-radius:1px;background:#dc1f26}

  /* map */
  #mapbox{flex:1 1 auto;min-height:0;position:relative;margin:4px 0 2px}
  #map{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}

  /* toolbar */
  #bar{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 12px 4px;gap:16px}
  .btns{display:flex;gap:32px}
  .btn{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    background:none;border:0;padding:0;cursor:pointer;font-family:inherit;
  }
  .btn .ico{
    width:38px;height:27px;border-radius:7px;background:var(--purple);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(70,30,150,.28);transition:background .15s,transform .08s;
  }
  .btn:hover .ico{background:#7a51e2}
  .btn:active .ico{transform:translateY(1px)}
  .btn.on .ico{background:#4a20ad}
  .btn .txt{font-size:12.5px;color:#3a3a3a;letter-spacing:.3px}
  #status{font-size:12px;color:#8a8a8a;font-variant-numeric:tabular-nums;padding-bottom:4px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}

  /* ---------- right ---------- */
  #right{flex:1 1 44%;position:relative;min-width:340px;background:#2f3033;border-left:1px solid #d8d8d8;overflow:hidden}
  #globe{display:block;width:100%;height:100%;cursor:grab}
  #globe.drag{cursor:grabbing}
  #hint{
    position:absolute;right:16px;bottom:14px;font-size:11.5px;color:rgba(255,255,255,.42);
    letter-spacing:.4px;pointer-events:none;user-select:none;
  }
  #btnPrec{
    position:absolute;top:10px;right:12px;z-index:6;cursor:pointer;user-select:none;
    background:rgba(40,42,46,.85);color:#ffd76e;border:1px solid #5a5b60;border-radius:14px;
    font-size:11.5px;padding:4px 12px;letter-spacing:.4px;
  }
  #btnPrec:hover{background:rgba(64,66,72,.9)}
  /* 浮动窗口挂在 body 上、position:fixed —— 可以拖到左侧平面图区域显示（不受 #right 裁剪） */
  #precWin{
    position:fixed;top:40px;right:12px;z-index:80;width:308px;display:none;
    background:#212327;border:1px solid #56575c;border-radius:10px;
    box-shadow:0 8px 28px rgba(0,0,0,.45);color:#d7dce3;
  }
  #precWin.show{display:block}
  #precWin .phead{cursor:move;user-select:none;touch-action:none}
  #precRsz{
    position:absolute;right:2px;bottom:2px;width:15px;height:15px;cursor:nwse-resize;z-index:3;
    background:linear-gradient(135deg, transparent 52%, rgba(255,215,110,.55) 52%);
  }
  #btnDN{
    position:absolute;top:6px;right:56px;z-index:4;cursor:pointer;user-select:none;
    background:#fff;border:1px solid #b9b9c2;border-radius:12px;padding:3px 11px;
    font-size:11.5px;color:#4a4a4a;letter-spacing:.3px;box-shadow:0 1px 2px rgba(0,0,0,.08);
    font-family:inherit;
  }
  #btnDN:hover{border-color:#7a51e2;color:#5a2ec0}
  #btnDN.off{color:#9a9aa2;border-color:#d5d5db}
  .phead{display:flex;align-items:center;justify-content:space-between;padding:9px 12px 5px;font-weight:600;font-size:12.5px;color:#ffd76e;letter-spacing:.3px}
  .phead button{background:none;border:0;color:#9a9ba0;font-size:17px;line-height:1;cursor:pointer;padding:0 3px}
  .phead button:hover{color:#fff}
  #prec{display:block;margin:0 auto}
  .pinfo{padding:4px 14px 2px;font-size:11.5px;line-height:1.75;color:#c9d0d8}
  .pinfo b{color:#ffd76e;font-variant-numeric:tabular-nums}
  .pfoot{display:flex;align-items:center;gap:6px;padding:2px 14px 10px;font-size:11.5px;color:#9a9ba0;user-select:none}
  .pfoot input{accent-color:#7a51e2}

  .preset{margin:10px 8px 0;display:flex;gap:8px}
  .pbtn{
    flex:1;cursor:pointer;background:#fff;border:1px solid #c9c9cf;border-radius:8px;
    padding:7px 4px;font-size:12.5px;color:#3a3a3a;letter-spacing:.2px;white-space:nowrap;
  }
  .pbtn:hover{border-color:#7a51e2;color:#5a2ec0}
  .pbtn.sel{font-weight:700;box-shadow:inset 0 0 0 1.6px currentColor}
  .pbtn.pC.sel{color:#b02a56;border-color:#d6336c}
  .pbtn.pD.sel{color:#1787ab;border-color:#1f9ece}
  .pbtn.pE.sel{color:#b87408;border-color:#e8940c}

  /* 卫星显示开关（可多星同显） */
  .satrow{display:flex;align-items:center;gap:7px;margin:8px 8px 0;padding:0 2px;white-space:nowrap}
  .satrow .slab{font-size:12px;color:#4d4d4d;letter-spacing:.2px}
  .chip{
    display:flex;align-items:center;gap:5px;height:24px;padding:0 10px;cursor:pointer;
    background:#fff;border:1px solid #c9c9cf;border-radius:12px;font-family:inherit;
    font-size:11.5px;color:#6a6a70;letter-spacing:.2px;transition:all .15s;
  }
  .chip i{display:block;width:8px;height:8px;border-radius:50%;background:#c4c4ca;flex:0 0 auto}
  .chip:hover{border-color:#7a51e2;color:#5a2ec0}
  .chip.on{background:#f4f4f6;color:#3a3a3a;font-weight:600}
  .chip.sel{border-color:#7a51e2;box-shadow:0 0 0 1.5px rgba(107,63,212,.25)}
  .satrow label{font-size:11.5px;color:#6a6a70;display:flex;align-items:center;gap:4px;cursor:pointer;margin-left:auto}
  .satrow input{accent-color:#7a51e2}

  /* 自转周期二选一 */
  .seg{display:flex;gap:6px}
  .segbtn{flex:1;height:24px;border:1px solid #c9c9cf;border-radius:7px;background:#fff;color:#6a6a70;
    font-family:inherit;font-size:11.5px;letter-spacing:.3px;cursor:pointer;transition:all .15s;
    white-space:nowrap;padding:0 4px}
  .segbtn:hover{border-color:#7a51e2;color:#5a2ec0}
  .segbtn.on{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:600}

  /* 日期行 */
  .daterow{display:flex;align-items:center;gap:8px;margin:10px 8px 0;white-space:nowrap}
  input[type="date"]{height:24px;border:1px solid #d5d5d5;border-radius:5px;background:#fafafa;
    font-family:inherit;font-size:12px;color:#333;padding:0 6px;font-variant-numeric:tabular-nums}
  .dnote{color:#8c8c8c;font-size:11px;letter-spacing:.2px}

  @media (max-width:900px){
    body{overflow:auto}
    #app{flex-direction:column;height:auto;min-height:100%}
    #left{min-width:0;flex:none;padding:14px 14px 10px}
    #mapbox{height:300px;flex:none}
    #right{flex:none;height:420px;border-left:0;border-top:1px solid #d8d8d8}
    .grid{gap:12px 18px}
  }
</style>
</head>
<body>
<div id="app">
  <section id="left">
    <h1>卫星星下点轨迹</h1>

    <div id="controls">
      <div class="grid">
        <div class="ctrl">
          <div class="lab"><span title="地球自转一周的时间：太阳日 24 h（相对太阳，决定昼夜节律）／恒星日 23 h 56 m 04 s（相对恒星，地球的真实自转周期）">自转周期</span><span class="val" id="vRot">太阳日 24 h</span></div>
          <div class="seg" id="segRot">
            <button class="segbtn on" data-v="24" title="太阳日：24 小时，昼夜节律以它为准">太阳日 24h</button>
            <button class="segbtn" data-v="23.9344444" title="恒星日：23 小时 56 分 04 秒，地球相对恒星的真实自转周期；比太阳日短，地面轨迹每天西移约 1°">恒星日 23h56m</button>
          </div>
        </div>
        <div class="ctrl o">
          <div class="lab"><span>卫星周期</span><span class="val" id="vTsat">1.7 h</span></div>
          <input id="inTsat" type="range" min="0" max="24" step="0.1" value="1.7">
        </div>
        <div class="ctrl g">
          <div class="lab"><span title="升交点：卫星轨道与天赤道的交点，卫星自南向北穿越赤道的那一个点；其赤经记为 Ω">升交点赤经 Ω</span><span class="val" id="vNode">210°</span></div>
          <input id="inNode" type="range" class="r-green" min="0" max="360" step="1" value="210" title="拖动时最东点赤经 α 同步变化（α = Ω + 90°）">
        </div>
        <div class="ctrl g">
          <div class="lab"><span title="轨道倾角 i（°）：0°=赤道轨道，±90°=极地轨道，|i|>90° 为逆行轨道；|i| 为可达的最大纬度绝对值。太阳同步轨道 i≈98.8°">轨道倾角</span><span class="val" id="vIncl">98.8°</span></div>
          <input id="inIncl" type="range" class="r-green" min="-180" max="180" step="1" value="99">
        </div>
      </div>
    </div>
    <div class="preset">
      <button id="btnFYC" class="pbtn pC" title="风云一号C星（FY-1C）：太阳同步极轨气象卫星。周期 1.6 h、倾角 97.4°、升交点地方时 09:00；轨道面每天东进 0.9856°（J2 摄动）与地球公转同步，过升交点地方时恒定。点击后该星独立选中显示，可在下方开关行叠加其它星">预设 · 风云C星</button>
      <button id="btnFYD" class="pbtn pD" title="风云一号D星（FY-1D）：太阳同步极轨气象卫星。周期 1.9 h、倾角 99.5°、升交点地方时 15:00；轨道面每天东进 0.9856°（J2 摄动）与地球公转同步。点击后该星独立选中显示，可在下方开关行叠加其它星">预设 · 风云D星</button>
      <button id="btnFY" class="pbtn pE" title="风云三号E星（FY-3E）：我国太阳同步晨昏轨道气象卫星。周期 1.7 h（≈102 min）、倾角 98.8°、升交点地方时 06:00；轨道面每天东进 0.9856° 与地球公转同步，故每天以相同地方时过境（晨昏轨道）。点击后该星独立选中显示，可在下方开关行叠加其它星">预设 · 风云E星</button>
    </div>

    <div class="satrow" id="satRow">
      <span class="slab">显示卫星</span>
      <button class="chip" data-i="0" title="显示/隐藏 风云C星（可与其它星同时显示；选中星以紫色描边标记，左侧滑块编辑的是选中星）"><i></i>风云C</button>
      <button class="chip" data-i="1" title="显示/隐藏 风云D星（可与其它星同时显示）"><i></i>风云D</button>
      <button class="chip" data-i="2" title="显示/隐藏 风云E星（可与其它星同时显示）"><i></i>风云E</button>
      <label title="隐藏/显示平面图中各卫星的地面轨迹线（卫星位置标记仍保留）"><input type="checkbox" id="chkOrb" checked> 轨道线</label>
    </div>

    <div class="daterow">
      <span class="lname">日期</span>
      <input id="inDate" type="date" title="选择日期：太阳直射点纬度（季节）随日期变化，昼夜分布随之改变；日期也随仿真时间自动推进（可在此观察变化）">
      <span class="dnote" id="vDate">直射点 δ=0.0°N</span>
    </div>

    <div id="locate">
      <div class="lrow">
      <div class="lgroup tg">
        <span class="lname">最东点时刻</span>
        <span class="sub">北京时</span>
        <input id="inEastH" class="num t" type="text" inputmode="numeric" maxlength="2" value="19" title="时（北京时间 0-23）">
        <span class="tsep">:</span>
        <input id="inEastM" class="num t" type="text" inputmode="numeric" maxlength="2" value="00" title="分（0-59）">
        <span class="tsep">:</span>
        <input id="inEastS" class="num t" type="text" inputmode="numeric" maxlength="2" value="00" title="秒（0-59）">
        <button class="mini" id="btnEast">定位</button>
      </div>
      </div>

      <div class="lrow">
      <div class="lgroup">
        <span class="lname">星下点</span>
        <span class="sub">纬</span>
        <input id="inLatT" class="num" type="number" min="-90" max="90" step="0.5" value="36.0" title="纬度（°），北纬为正；可达最大值等于轨道倾角的绝对值 |i|">
        <span class="unit">°</span>
        <span class="sub">经</span>
        <input id="inLonT" class="num" type="number" min="-180" max="180" step="0.5" value="103.0" title="经度（°），东经为正">
        <span class="unit">°</span>
        <button class="mini" id="btnLL">定位</button>
      </div>
      <div class="lgroup">
        <span class="lname">最东点赤经</span>
        <span class="sub">α</span>
        <input id="inRA" class="num ra" type="text" inputmode="decimal" maxlength="6" value="90.0"
               title="最东点赤经 α（°）：最东点＝升交点沿轨道逆时针 90°，故 α = Ω + 90°。填好后回车或点「定位」，升交点赤经同步更新">
        <span class="unit">°</span>
        <button class="mini" id="btnRA">定位</button>
      </div>
      </div>
    </div>

    <div id="legend">
      <span><i class="red" id="lgDot"></i>当前星下点</span>
      <span><i class="dia"></i>最东点（升交点逆时针 90°）</span>
      <span><i class="line" id="lgLine"></i>最近 24 小时轨迹</span>
    </div>

    <div id="mapbox"><canvas id="map"></canvas><button id="btnDN" title="显示/隐藏昼夜半球分布（同时作用于平面图与右侧 3D 地球）">昼夜分布：开</button></div>

    <div id="bar">
      <div class="btns">
        <button class="btn" id="btnPlay">
          <span class="ico"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M8 4.5 20 12 8 19.5z" fill="#fff"/></svg></span>
          <span class="txt">播放</span>
        </button>
        <button class="btn" id="btnPause">
          <span class="ico"><svg width="12" height="12" viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.4" fill="#fff"/><rect x="14" y="4" width="5" height="16" rx="1.4" fill="#fff"/></svg></span>
          <span class="txt">暂停</span>
        </button>
        <button class="btn" id="btnReset">
          <span class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 12a8.2 8.2 0 1 1-2.7-6.1"/><path d="M20.4 3.6v4.5h-4.5"/></svg></span>
          <span class="txt">重置</span>
        </button>
      </div>
      <div id="status"></div>
    </div>
  </section>

  <section id="right">
    <canvas id="globe"></canvas>
    <button id="btnPrec" title="显示/隐藏：地球公转时各太阳同步卫星轨道面进动演示（多星对比）">公转进动</button>
    <div id="precWin">
      <div class="phead"><span>地球公转 · 轨道面进动（多星对比）</span><button id="btnPrecClose" title="隐藏窗口">×</button></div>
      <canvas id="prec"></canvas>
      <div class="pinfo" id="precInfo"></div>
      <div class="pfoot"><label><input type="checkbox" id="chkFast"> 时间加速 ×100（整页同步，日期随之变化）</label></div>
      <div id="precRsz" title="拖动调整窗口大小"></div>
    </div>
    <div id="hint">拖动旋转视角 · 滚轮缩放</div>
  </section>

  c.strokeStyle = 'rgba(255,200,70,.9)'; c.lineWidth = 1.4;
  for (let k=0; k<8; k++){
    const a = k*TAU/8 + 0.2;
    c.beginPath();
    c.moveTo(sx+Math.cos(a)*5.4, sy+Math.sin(a)*5.4);
    c.lineTo(sx+Math.cos(a)*8.2, sy+Math.sin(a)*8.2);
    c.stroke();
  }
  c.beginPath(); c.arc(sx,sy,3.4,0,TAU);
  c.fillStyle = '#ffcf55'; c.fill();
  c.strokeStyle = 'rgba(255,246,214,.9)'; c.lineWidth = 1; c.stroke();
  const dnLab = '直射点 δ=' + Math.abs(dec).toFixed(1) + '°' + (dec>=0?'N':'S');
  c.font = '10.5px "Segoe UI","Microsoft YaHei",sans-serif';
  const lw = c.measureText(dnLab).width;
  const toLeft = (sx + 14 + lw > L.x0 + L.w);
  c.textAlign = toLeft ? 'right' : 'left'; c.textBaseline = 'middle';
  const lx = toLeft ? sx - 13 : sx + 13, ly = Math.min(L.y0+L.h-6, Math.max(L.y0+6, sy));
  c.lineWidth = 2.6; c.strokeStyle = 'rgba(255,255,255,.82)';
  c.strokeText(dnLab, lx, ly);
  c.fillStyle = '#d99b1a'; c.fillText(dnLab, lx, ly);
  c.restore();
}

/* ================= 地图帧绘制 ================= */
function drawMapFrame(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(stat,0,0);
  ctx.setTransform(dpr,0,0,dpr,0,0);

  drawDayNight(ctx);
  // 各可见卫星的最近 24h 轨迹（颜色区分；勾掉「轨道线」时只保留位置标记）
  for (let si=0; si<SATS.length; si++){
    if (SATS[si].show) drawTrailS(ctx, SATS[si], si===cur);
  }
  drawSubsolar(ctx);

  // 本圈最东点（仅选中卫星：与 α 输入框联动；取已发生过的那一个，保证落在轨迹线上）
  const uCur = TAU*S.t/TAU_T() + S.phase*DEG;
  let ue = eastU() + TAU*Math.floor((uCur + 1e-9)/TAU);
  if (ue > uCur) ue -= TAU;
  const ge = geoOf(satAtU(ue), (ue - S.phase*DEG)/TAU*TAU_T());
  const ex = X(ge.lon), ey = Y(ge.lat);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(ex, ey-5.2); ctx.lineTo(ex+5.2, ey); ctx.lineTo(ex, ey+5.2); ctx.lineTo(ex-5.2, ey);
  ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.strokeStyle = '#ef9420'; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.font = '11px "Segoe UI","Microsoft YaHei",sans-serif';
  ctx.textBaseline = 'bottom';
  const eTxt = '最东点 α=' + eastRANow().toFixed(1) + '°';
  const tw = ctx.measureText(eTxt).width;
  const xR = L.x0 + L.w - 2, xL = L.x0 + 2;
  // 竖向：默认标在标记上方；贴近上边缘（极轨最东点常在 80°N 以上）时改标在下方并下压一档，
  // 避免与顶部纬度刻度挤在一起；下方也放不下时再回上方
  const yTop = L.y0 + 15, yBot = L.y0 + L.h - 6;
  let ty = ey - 8;
  if (ty < yTop) ty = Math.min(ey + 26, yBot - 4);
  if (ty > yBot) ty = Math.max(ey - 26, yTop + 8);
  // 横向：靠近画布左右边缘时改为贴边对齐，避免文字被裁掉
  let tx = ex, align = 'center';
  if (ex + tw/2 > xR){ align = 'right'; tx = Math.min(ex - 6, xR - 6); }
  else if (ex - tw/2 < xL){ align = 'left'; tx = Math.max(ex + 6, xL + 8); }
  ctx.textAlign = align;
  ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.92)';
  ctx.strokeText(eTxt, tx, ty);
  ctx.fillStyle = '#c9761a';
  ctx.fillText(eTxt, tx, ty);
  ctx.restore();

  // 各可见卫星当前位置标记（选中的星加十字准星与大点，其余为小点）
  let gSel = null;
  for (let si=0; si<SATS.length; si++){
    const s = SATS[si]; if (!s.show) continue;
    const g = geoOf(satAtS(s, S.t), S.t);
    const x = X(g.lon), y = Y(g.lat);
    if (si === cur){
      gSel = g;
      ctx.strokeStyle = 'rgba(60,60,70,.35)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x-11,y); ctx.lineTo(x+11,y);
      ctx.moveTo(x,y-11); ctx.lineTo(x,y+11);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(x,y,4.1,0,TAU);
      ctx.fillStyle = s.mapCol; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4; ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(x,y,3,0,TAU);
      ctx.fillStyle = s.mapCol; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.1; ctx.stroke();
    }
  }
  return gSel;
}

/* ================= 3D 地球 ================= */
const view = { lon: 80, lat: 19, zoom: 1 };
/* 默认相机：相对轨道面固定取一个斜侧方向（约 31° 离面），任一升交点/倾角下轨道环都是舒展的椭圆 */
function camDir(){
  const a = view.lat*DEG, b = view.lon*DEG;
  return [Math.cos(a)*Math.cos(b), Math.cos(a)*Math.sin(b), Math.sin(a)];
}
/* 轨道面法向（s 缺省＝选中卫星） */
function orbitNormal(s){
  s = s || S;
  const i = s.incl*DEG, O = s.node*DEG;
  return [Math.sin(i)*Math.sin(O), -Math.sin(i)*Math.cos(O), Math.cos(i)];
}
/* 视角几乎与轨道面共面时，轨道环会退化成一条线：此时回到相对轨道面的标准斜侧视角 */
function keepViewReadable(){
  if (Math.abs(dot3(camDir(), orbitNormal())) > 0.30) return;
  setDefaultView();
}
function setDefaultView(){
  const i = S.incl*DEG, O = S.node*DEG;
  const e1 = [Math.cos(O), Math.sin(O), 0];
  const e2 = [-Math.cos(i)*Math.sin(O), Math.cos(i)*Math.cos(O), Math.sin(i)];
  const n  = [Math.sin(i)*Math.sin(O), -Math.sin(i)*Math.cos(O), Math.cos(i)];
  const c  = norm3([0.86*e1[0] + 0.08*e2[0] + 0.52*n[0],
                    0.86*e1[1] + 0.08*e2[1] + 0.52*n[1],
                    0.86*e1[2] + 0.08*e2[2] + 0.52*n[2]]);
  view.lat = Math.asin(clamp(c[2],-1,1))/DEG;
  view.lon = Math.atan2(c[1], c[0])/DEG;
}

function drawGlobe(){
  const c = gctx, W = GW, H = GH;
  const base = Math.min(W,H);
  const R = base * 0.212 * view.zoom;
  const cx = W*0.5, cy = H*0.505;

  c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle = '#2f3033'; c.fillRect(0,0,W,H);

  const vLat = view.lat*DEG, vLon = view.lon*DEG;
  const camD = [Math.cos(vLat)*Math.cos(vLon), Math.cos(vLat)*Math.sin(vLon), Math.sin(vLat)];
  const camR = norm3(cross3([0,0,1], camD));
  const camU = cross3(camD, camR);
  const theta = TAU*((S.t % S.rot)/S.rot);

  // 屏幕投影：k 为半径倍数
  const px = (p,k)=> cx + R*k*(p[0]*camR[0]+p[1]*camR[1]+p[2]*camR[2]);
  const py = (p,k)=> cy - R*k*(p[0]*camU[0]+p[1]*camU[1]+p[2]*camU[2]);
  const pd = p => p[0]*camD[0]+p[1]*camD[1]+p[2]*camD[2];

  /* 通用描线：points 为单位方向数组；front=true 只画正面，false 只画背面 */
  function strokeDirs(pts, k, front, color, lw, alpha){
    c.save();
    c.globalAlpha = alpha;
    c.strokeStyle = color; c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath();
    let pD=0, pX=0, pY=0, has=false, pVis=false;
    for (let i=0; i<pts.length; i++){
      const p = pts[i], d = pd(p);
      const vis = front ? d >= 0 : d < 0;
      const x = px(p,k), y = py(p,k);
      if (vis){
        if (!has || !pVis){
          if (has){ const f = pD/(pD-d); c.moveTo(pX+(x-pX)*f, pY+(y-pY)*f); }
          else c.moveTo(x,y);
          c.lineTo(x,y);
        } else c.lineTo(x,y);
      } else if (has && pVis){
        const f = pD/(pD-d);
        c.lineTo(pX+(x-pX)*f, pY+(y-pY)*f);
      }
      pD=d; pX=x; pY=y; has=true; pVis=vis;
    }
    c.stroke();
    c.restore();
  }

  /* 贴地经纬线 → 方向数组生成器（rot 为自转角） */
  function latLonDirs(lats, lons, rot){
    const out = new Array(lats.length);
    for (let i=0;i<lats.length;i++){
      const a = lats[i]*DEG, o = lons[i]*DEG + rot;
      const ca = Math.cos(a);
      out[i] = [ ca*Math.cos(o), ca*Math.sin(o), Math.sin(a) ];
    }
    return out;
  }

  /* ---------- 轨道环（背面，多星各自颜色） ---------- */
  for (let si=0; si<SATS.length; si++){
    const s = SATS[si]; if (!s.show) continue;
    strokeDirs(orbitDirs(s), K_ORB, false, s.ring, si===cur ? 1.5 : 1.1, 1);
  }

  /* ---------- 球体 ---------- */
  // 太阳方向：同时用于球面高光位置与夜面阴影（光照一致）
  const sunD = showDN ? latLonDirs([subsolarLat()],[subsolarLon()],theta)[0] : null;
  const hsx = sunD ? dot3(sunD, camR) : -0.9;
  const hsy = sunD ? dot3(sunD, camU) : 0.9;
  const hn  = Math.hypot(hsx,hsy) || 1;
  const grd = c.createRadialGradient(
    cx + R*0.34*(hsx/hn), cy - R*0.38*(hsy/hn), R*0.03, cx, cy, R*1.03);
  grd.addColorStop(0,'#eaf4ff');
  grd.addColorStop(0.30,'#c3dcf2');
  grd.addColorStop(0.68,'#82a9ce');
  grd.addColorStop(1,'#43678f');
  c.beginPath(); c.arc(cx,cy,R,0,TAU); c.fillStyle = grd; c.fill();

  // 边缘压暗，增强体积感
  const rim = c.createRadialGradient(cx,cy,R*0.72, cx,cy,R);
  rim.addColorStop(0,'rgba(30,60,100,0)');
  rim.addColorStop(1,'rgba(24,48,80,.35)');
  c.beginPath(); c.arc(cx,cy,R,0,TAU); c.fillStyle = rim; c.fill();

  /* ---------- 经纬网 ---------- */
  c.save();
  for (let lat=-60; lat<=60; lat+=30){
    const lats=[], lons=[];
    for (let lon=-180; lon<=180; lon+=4){ lats.push(lat); lons.push(lon); }
    strokeDirs(latLonDirs(lats,lons,theta), 1, true, 'rgba(20,44,92,.55)', 1, 1);
  }
  for (let lon=-180; lon<180; lon+=30){
    const lats=[], lons=[];
    for (let lat=-90; lat<=90; lat+=4){ lats.push(lat); lons.push(lon); }
    strokeDirs(latLonDirs(lats,lons,theta), 1, true, 'rgba(20,44,92,.45)', 1, 1);
  }
  c.restore();

  /* ---------- 海岸线 ---------- */
  for (let r=0; r<WORLD.length; r++){
    const ring = WORLD[r], n = ring.length/2;
    const lats = new Array(n), lons = new Array(n);
    for (let i=0;i<n;i++){ lons[i]=ring[i*2]; lats[i]=ring[i*2+1]; }
    strokeDirs(latLonDirs(lats,lons,theta), 1, true, '#20539f', 1.1, 1);
  }

  /* ---------- 昼夜半球（夜面阴影 + 晨昏线） ---------- */
  if (showDN && sunD){
    const dc = dot3(camD, sunD);
    const NIGHT = 'rgba(9,14,34,.42)';
    c.save();
    if (dc <= -0.999){                       // 太阳在正后方：整个可见面为夜
      c.beginPath(); c.arc(cx,cy,R,0,TAU);
      c.fillStyle = NIGHT; c.fill();
    } else if (dc < 0.999){
      const Nv = cross3(camD, sunD);
      if (Math.hypot(Nv[0],Nv[1],Nv[2]) > 1e-9){
        const A = norm3(cross3(sunD, Nv));
        const B = cross3(sunD, A);
        const M = 72;
        // 晨昏线的正面弧（pd>=0 的半圆，从 aP−π/2 到 aP+π/2）
        const aP = Math.atan2(dot3(B,camD), dot3(A,camD));
        const tPts = [];
        for (let k=0; k<=M; k++){
          const a = aP - Math.PI/2 + Math.PI*k/M;
          tPts.push([Math.cos(a)*A[0]+Math.sin(a)*B[0],
                     Math.cos(a)*A[1]+Math.sin(a)*B[1],
                     Math.cos(a)*A[2]+Math.sin(a)*B[2]]);
        }
        // 轮廓线上夜侧的半弧（与太阳方向夹角 < 90°）
        const psiM = Math.atan2(dot3(camU,sunD), dot3(camR,sunD));
        const lPts = [];
        for (let k=0; k<=M; k++){
          const psi = psiM + Math.PI/2 + Math.PI*k/M;
          lPts.push([Math.cos(psi)*camR[0]+Math.sin(psi)*camU[0],
                     Math.cos(psi)*camR[1]+Math.sin(psi)*camU[1],
                     Math.cos(psi)*camR[2]+Math.sin(psi)*camU[2]]);
        }
        // 匹配晨昏线末端与轮廓线端点（两者均为 ±(camD×sunD) 方向）
        const tEnd = tPts[tPts.length-1];
        const d0 = (lPts[0][0]-tEnd[0])**2 + (lPts[0][1]-tEnd[1])**2 + (lPts[0][2]-tEnd[2])**2;
        const d1 = (lPts[M][0]-tEnd[0])**2 + (lPts[M][1]-tEnd[1])**2 + (lPts[M][2]-tEnd[2])**2;
        const limb = d0 <= d1 ? lPts : lPts.slice().reverse();
        // 夜面 = 晨昏线正面弧 + 轮廓夜侧弧 围成的区域
        c.beginPath();
        tPts.concat(limb).forEach((p,kk)=>{
          const x = px(p,1), y = py(p,1);
          if (kk) c.lineTo(x,y); else c.moveTo(x,y);
        });
        c.closePath();
        c.fillStyle = NIGHT; c.fill();
        // 晨昏线
        c.beginPath();
        tPts.forEach((p,kk)=>{
          const x = px(p,1), y = py(p,1);
          if (kk) c.lineTo(x,y); else c.moveTo(x,y);
        });
        c.strokeStyle = 'rgba(255,232,160,.5)'; c.lineWidth = 1.2;
        c.stroke();
      }
    }
    c.restore();
  }

  /* ---------- 太阳直射点标记（日期决定其纬度，晨昏圈随之倾斜） ---------- */
  if (showDN && sunD && dot3(camD, sunD) > 0.06){
    const sx = px(sunD,1), sy = py(sunD,1);
    c.save();
    const sg2 = c.createRadialGradient(sx,sy,1, sx,sy,13);
    sg2.addColorStop(0,'rgba(255,248,200,.95)');
    sg2.addColorStop(0.36,'rgba(255,206,80,.55)');
    sg2.addColorStop(1,'rgba(255,190,60,0)');
    c.fillStyle = sg2; c.beginPath(); c.arc(sx,sy,13,0,TAU); c.fill();
    c.beginPath(); c.arc(sx,sy,3.2,0,TAU); c.fillStyle = '#fff6cf'; c.fill();
    c.font = 'italic 11px "Segoe UI","Microsoft YaHei",sans-serif';
    c.textAlign = 'left'; c.textBaseline = 'middle';
    c.lineWidth = 2.6; c.strokeStyle = 'rgba(12,24,44,.75)';
    c.strokeText('直射点', sx+11, sy-12);
    c.fillStyle = '#ffeeb4';
    c.fillText('直射点', sx+11, sy-12);
    c.restore();
  }

  /* ---------- 轨道环（正面，多星各自颜色） ---------- */
  for (let si=0; si<SATS.length; si++){
    const s = SATS[si]; if (!s.show) continue;
    strokeDirs(orbitDirs(s), K_ORB, true, s.ringF, si===cur ? 1.6 : 1.25, 1);
  }

  /* ---------- 卫星（模拟 3D 模型，可多星同显；选中星最后绘制置顶） ---------- */
  // 世界坐标（单位球坐标系）→ 屏幕，返回 [x, y, 深度]（深度越大越靠近相机）
  function proj3(P){
    return [ cx + R*(P[0]*camR[0]+P[1]*camR[1]+P[2]*camR[2]),
             cy - R*(P[0]*camU[0]+P[1]*camU[1]+P[2]*camU[2]),
             P[0]*camD[0]+P[1]*camD[1]+P[2]*camD[2] ];
  }
  // 长方体 → 面片：局部正交坐标系 ax/ay/az，半尺寸 hx/hy/hz；tag 只标到两个大面（帆板电池格线用）
  function boxFaces(center, ax, ay, az, hx, hy, hz, base, tag){
    const cs = [];
    for (let m=0;m<8;m++){
      const sx=(m&4)?1:-1, sy=(m&2)?1:-1, sz=(m&1)?1:-1;
      cs.push([ center[0]+sx*hx*ax[0]+sy*hy*ay[0]+sz*hz*az[0],
                center[1]+sx*hx*ax[1]+sy*hy*ay[1]+sz*hz*az[1],
                center[2]+sx*hx*ax[2]+sy*hy*ay[2]+sz*hz*az[2] ]);
    }
    const quads = [[4,5,7,6],[0,1,3,2],[2,3,7,6],[0,1,5,4],[1,3,7,5],[0,2,6,4]];
    const out = [];
    quads.forEach((q,qi)=>{
      const w = q.map(k=>cs[k]);
      let nrm = norm3(cross3([w[1][0]-w[0][0],w[1][1]-w[0][1],w[1][2]-w[0][2]],
                             [w[2][0]-w[0][0],w[2][1]-w[0][1],w[2][2]-w[0][2]]));
      const ctr = [(w[0][0]+w[1][0]+w[2][0]+w[3][0])/4,
                   (w[0][1]+w[1][1]+w[2][1]+w[3][1])/4,
                   (w[0][2]+w[1][2]+w[2][2]+w[3][2])/4];
      if (dot3(nrm,[ctr[0]-center[0],ctr[1]-center[1],ctr[2]-center[2]]) < 0)
        nrm = [-nrm[0],-nrm[1],-nrm[2]];
      out.push({ p:w.map(proj3), n:nrm, d:dot3(ctr,camD), base, tag: qi<2 ? tag : null });
    });
    return out;
  }

  /* 各星独立模型：舱体配色、帆板数量/尺寸、天线形式均取自 SAT_MODELS[s.m] */
  function drawSatModelFor(s, u, ps, alpha){
    const M = SAT_MODELS[s.m];
    const i = s.incl*DEG, O = s.node*DEG;
    const e1 = [Math.cos(O), Math.sin(O), 0];
    const e2 = [-Math.cos(i)*Math.sin(O), Math.cos(i)*Math.cos(O), Math.sin(i)];
    const aD = [-Math.sin(u)*e1[0]+Math.cos(u)*e2[0],    // 沿轨道方向（速度）
                -Math.sin(u)*e1[1]+Math.cos(u)*e2[1],
                -Math.sin(u)*e1[2]+Math.cos(u)*e2[2]];
    const nD = orbitNormal(s);                           // 轨道面法向（帆板展开轴）
    const bD = cross3(aD, nD);                           // 面内横向
    const satPos = [ps[0]*K_ORB, ps[1]*K_ORB, ps[2]*K_ORB];

    let faces = [];
    // 本体舱体
    faces = faces.concat(boxFaces(satPos, aD, bD, nD, M.bh[0], M.bh[1], M.bh[2], M.body, null));
    // 太阳能帆板：沿轨道面法向 ± 展开（C 星每侧三段窄板，E/D 星每侧一块）
    for (const sg of [1,-1]){
      for (let q=0; q<M.segs; q++){
        const off = M.pOff + q*M.pGap;
        const pc = [satPos[0]+sg*off*nD[0], satPos[1]+sg*off*nD[1], satPos[2]+sg*off*nD[2]];
        faces = faces.concat(boxFaces(pc, aD, bD, nD, M.ph[0], M.ph[1], M.ph[2], M.panel, 'cell'));
      }
    }
    // 对地天线：碟形（杆+盘）或鞭状杆+端罩，始终指向地心
    const nad = ps;
    if (M.ant === 'dish'){
      const bc = [satPos[0]-0.048*nad[0], satPos[1]-0.048*nad[1], satPos[2]-0.048*nad[2]];
      faces = faces.concat(boxFaces(bc, aD, bD, nad, 0.009, 0.009, 0.024, [150,156,168], null));
      const dc = [satPos[0]-0.076*nad[0], satPos[1]-0.076*nad[1], satPos[2]-0.076*nad[2]];
      faces = faces.concat(boxFaces(dc, aD, bD, nad, 0.020, 0.020, 0.005, [188,194,205], null));
    } else {
      const bc = [satPos[0]-0.052*nad[0], satPos[1]-0.052*nad[1], satPos[2]-0.052*nad[2]];
      faces = faces.concat(boxFaces(bc, aD, bD, nad, 0.006, 0.006, 0.030, [150,156,168], null));
      const tc = [satPos[0]-0.090*nad[0], satPos[1]-0.090*nad[1], satPos[2]-0.090*nad[2]];
      faces = faces.concat(boxFaces(tc, aD, bD, nad, 0.010, 0.010, 0.007, [222,227,234], null));
    }

    // 画家算法：由远及近绘制
    faces.sort((f1,f2)=>f1.d-f2.d);
    const L = norm3([camD[0]+0.45*camU[0]+0.30*camR[0],
                     camD[1]+0.45*camU[1]+0.30*camR[1],
                     camD[2]+0.45*camU[2]+0.30*camR[2]]);
    c.save();
    c.globalAlpha = alpha;
    for (const f of faces){
      const br = 0.50 + 0.50*Math.max(0, dot3(f.n, L));
      c.beginPath();
      c.moveTo(f.p[0][0], f.p[0][1]);
      for (let k=1;k<4;k++) c.lineTo(f.p[k][0], f.p[k][1]);
      c.closePath();
      c.fillStyle = 'rgb('+Math.round(f.base[0]*br)+','+Math.round(f.base[1]*br)+','+Math.round(f.base[2]*br)+')';
      c.fill();
      c.strokeStyle = 'rgba(12,14,22,.45)'; c.lineWidth = 0.7; c.stroke();
      // 帆板电池格线（仅朝向相机的大面）
      if (f.tag==='cell' && dot3(f.n, camD) > 0){
        const A=f.p[0], B=f.p[1], C2=f.p[3], D2=f.p[2];
        c.strokeStyle = M.cell; c.lineWidth = 0.8;
        c.beginPath();
        for (const t of [1/3, 2/3]){    // 沿长边方向三分
          c.moveTo(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t);
          c.lineTo(C2[0]+(D2[0]-C2[0])*t, C2[1]+(D2[1]-C2[1])*t);
        }
        c.moveTo(A[0]+(C2[0]-A[0])*0.5, A[1]+(C2[1]-A[1])*0.5);   // 沿短边方向二分
        c.lineTo(B[0]+(D2[0]-B[0])*0.5, B[1]+(D2[1]-B[1])*0.5);
        c.stroke();
      }
    }
    c.restore();
  }

  /* 逐星绘制：被地球挡住的星完全不可见；远侧未挡住的画半透明；选中星置顶 */
  const order = [];
  for (let si=0; si<SATS.length; si++) if (SATS[si].show) order.push(si);
  order.sort((a,b)=> (a===cur) - (b===cur));
  let gSel = null;
  for (const oi of order){
    const s = SATS[oi];
    const u = TAU*S.t/tauTs(s) + s.phase*DEG;
    const ps = satAtU(u, s);
    const dS = pd(ps);
    const sel = oi === cur;
    if (sel) gSel = geoOf(ps, S.t);

    const sX = px(ps,K_ORB), sY = py(ps,K_ORB);
    const gX = px(ps,1),    gY = py(ps,1);
    const front = dS >= 0;                                 // 是否位于地球近侧
    const inDisc = Math.hypot(sX-cx, sY-cy) < R - 1;       // 投影是否落在地球圆面内
    const occluded = !front && inDisc;                     // 只有被地球挡住时才真正不可见
    if (occluded) continue;
    const ldy = (order.length > 1) ? (oi - 1)*9 : 0;       // 多星同显时标签错开，避免叠在一起

    if (front){
      // 近侧：星下点连线 + 星下点 + 柔光 + 3D 卫星模型 + 标签
      c.save();
      c.setLineDash([6,5]);
      c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = sel ? 1.2 : 0.9;
      c.beginPath(); c.moveTo(sX,sY); c.lineTo(gX,gY); c.stroke();
      c.restore();

      c.beginPath(); c.arc(gX,gY,sel?3:2.2,0,TAU);
      c.fillStyle = s.mapCol; c.fill();

      c.save();
      c.shadowColor = s.glow; c.shadowBlur = sel ? 12 : 8;
      c.fillStyle = s.glow.replace(/,[.\d]+\)$/, ',.12)');
      c.beginPath(); c.arc(sX,sY,sel?7:5,0,TAU); c.fill();
      c.restore();

      drawSatModelFor(s, u, ps, 1);

      c.fillStyle = s.labCol;
      c.font = 'italic ' + (sel?13:12) + 'px "Segoe UI","Microsoft YaHei",sans-serif';
      c.textBaseline = 'middle';
      c.textAlign = 'left';
      const lw2 = c.measureText(s.tag).width;
      if (sX + 18 + lw2 > W - 4){ c.textAlign = 'right'; c.fillText(s.tag, sX - 16, sY+1+ldy); }
      else c.fillText(s.tag, sX+18, sY+1+ldy);
    } else {
      // 远侧但没被地球挡住：画成半透明模型，始终可追踪
      c.save();
      c.beginPath(); c.rect(0,0,W,H);
      c.arc(cx,cy,R,0,TAU,true);          // 反向圆 → 挖空地球圆面
      c.clip();

      drawSatModelFor(s, u, ps, 0.5);
      c.restore();

      // 标签画在裁剪之外：贴着地平线时向地球轮廓外偏，避免被圆面裁掉
      c.fillStyle = s.labCol.replace(/,[.\d]+\)$/, ',.75)');
      c.font = 'italic 12px "Segoe UI","Microsoft YaHei",sans-serif';
      c.textBaseline = 'middle'; c.textAlign = 'left';
      let lx = sX + 14, ly = sY + 1 + ldy;
      if (inDisc){
        const dx = sX-cx, dy = sY-cy, dd = Math.hypot(dx,dy) || 1;
        lx = cx + dx/dd*(R+14); ly = cy + dy/dd*(R+14);
        c.textAlign = dx >= 0 ? 'left' : 'right';
      }
      c.fillText(s.tag, lx, ly);
    }
  }

  return gSel;
}

/* 轨道环单位方向（每帧按各星当前参数现算：181 点 × 3 星，开销可忽略） */
function orbitDirs(s){
  const pts = new Array(181);
  for (let d=0; d<=360; d+=2) pts[d/2] = satAtU(d*DEG, s);
  return pts;
}

/* ================= 尺寸 ================= */
function resizeMap(){
  const bw = Math.max(1, mapBox.clientWidth);
  const bh = Math.max(1, mapBox.clientHeight);
  L = layout(bw,bh);
  MW = L.cw; MH = L.ch;
  cv.style.width = MW+'px'; cv.style.height = MH+'px';
  cv.width = Math.round(MW*dpr); cv.height = Math.round(MH*dpr);
  stat.width = cv.width; stat.height = cv.height;
  drawStatic();
}
function resizeGlobe(){
  GW = Math.max(1, gcv.clientWidth);
  GH = Math.max(1, gcv.clientHeight);
  gcv.width = Math.round(GW*dpr); gcv.height = Math.round(GH*dpr);
}
function resizeAll(){ resizeMap(); resizeGlobe(); }

/* ================= 定位：最东点 / 指定星下点 ================= */
/* 最东点 = 轨道升交点逆时针旋转 90° 处（轨道幅角 u = 90°，北半程最高纬点）。
   该点相对赤经 atan2(cos i·sin u, cos u) 恒为 90°，故：
     最东点赤经 α_E = 升交点赤经 Ω + 90°，纬度 = 倾角 i
   令 α_E = 90° 即得 Ω = 0°。 */
const EAST_U = Math.PI/2;
function eastU(){ return EAST_U; }

/* 本圈内到达最东点的时刻（h，0~T） */
function eastTimeBase(){
  const T = TAU_T();
  let t = (eastU() - S.phase*DEG)/TAU*T;
  t = ((t % T) + T) % T;
  return (t > T - 1e-6) ? 0 : t;
}

/* 最近一次最东点对应的北京时间（0~24 h） */
function eastClockNow(){
  const T = TAU_T(), tE = eastTimeBase();
  const t = tE + T*Math.floor((S.t - tE)/T + 1e-9);
  return ((t % 24) + 24) % 24;
}

/* 最东点处的相对赤经（度）：α − Ω = atan2(cos i·sin u, cos u)；|i|=90° 时 cos i 浮点噪声归零 */
function relRADeg(u){
  const ci = Math.cos(S.incl*DEG);
  return Math.atan2(Math.abs(ci) < 1e-12 ? 0 : ci*Math.sin(u), Math.cos(u))/DEG;
}

/* 当前配置下本圈最东点的惯性赤经（度，0~360） */
function eastRANow(){
  const a = S.node + relRADeg(eastU());
  return ((a % 360) + 360) % 360;
}

/* 设定“最东点赤经” → 反解升交点赤经 Ω */
function applyEastRA(ra){
  const R = (((isFinite(ra) ? ra : 0) % 360) + 360) % 360;
  let node = R - relRADeg(eastU());
  node = ((node % 360) + 360) % 360;
  S.node = Math.round(node*10)/10;
  if (S.node >= 360) S.node -= 360;
  $('inNode').value = Math.round(S.node);
  setPlaying(false);
  keepViewReadable();
  setRAField(R);
  syncLabels(); syncLLInput(); syncEastInput();
}

/* 同时是 24 h 与卫星周期的整数倍的最小跨度（整周期平移不改变钟点与相位） */
function dayLapPeriod(){
  const n = Math.max(1, Math.round(TAU_T()*10));      // 周期 = n/10 小时
  return 24 * n / gcdInt(n, 240);
}

/* 定位到“最东点时刻（北京时间）” */
function applyEastClock(C){
  const T = TAU_T(), t0 = S.t;
  C = ((C % 24) + 24) % 24;
  // 找一个圈次，使该次最东点正好落在钟点 C：tE = (C - k·T) 落在 [0,T)
  let tE = null, k = 0;
  const kmax = Math.ceil(24/T) + 2;
  for (k=0; k<=kmax; k++){
    const v = ((C - k*T) % 24 + 24) % 24;
    if (v < T - 1e-9){ tE = v; break; }
  }
  if (tE === null){ tE = ((C % T) + T) % T; k = 0; }

  let ph = (eastU() - TAU*tE/T)/DEG;
  ph = ((ph % 360) + 360) % 360;
  S.phase = ph;                                  // 不取整，保证精确到秒

  S.t = tE + k*T;
  const Lp = dayLapPeriod();
  for (let g=0; g<20 && S.t < TRAIL_H - 1e-9 && Lp <= 240; g++) S.t += Lp;   // 补足 24h 轨迹

  /* 太阳同步卫星的 Ω 进动统一由主循环按 Δt 处理（本函数造成的时间跳变下一帧自动补上） */

  setPlaying(false);
  syncLabels(); syncEastInput(); syncLLInput();
}

/* "HH:MM[:SS]" / 数字 → 小时 */
function parseClock(str){
  const p = String(str).trim().split(':').map(Number);
  if (p.length >= 2) return (p[0]||0) + (p[1]||0)/60 + (p[2]||0)/3600;
  return isFinite(p[0]) ? p[0] : 0;
}

/* 定位到指定星下点（当前时刻） */
function applyLatLon(lat0, lon0){
  const T = TAU_T(), si = Math.sin(S.incl*DEG), ci = Math.cos(S.incl*DEG);
  let lat = clamp(isFinite(lat0) ? lat0 : 0, -90, 90);
  const ai = Math.abs(S.incl);
  if (Math.abs(lat) > ai) lat = (lat < 0 ? -1 : 1) * ai;    // 受倾角限制
  let lon = isFinite(lon0) ? lon0 : 0;
  lon = ((lon + 180) % 360 + 360) % 360 - 180;

  const uCur = TAU*S.t/T + S.phase*DEG;
  let u = 0;
  if (Math.abs(si) > 1e-6){
    const a1 = Math.asin(clamp(Math.sin(lat*DEG)/si, -1, 1));
    const a2 = Math.PI - a1;
    const dA = x => Math.abs(Math.atan2(Math.sin(x-uCur), Math.cos(x-uCur)));
    u = dA(a1) <= dA(a2) ? a1 : a2;          // 取离当前位置近的那一支，避免跳变
  }

  // 相位：让“当前时刻”正好走到幅角 u（纬度由它决定）
  let ph = (u - TAU*S.t/T)/DEG;
  ph = ((ph % 360) + 360) % 360;
  S.phase = Math.round(ph*10)/10;
  if (S.phase >= 360) S.phase -= 360;

  // 升交点经度：把该幅角的经度对到目标（经度由它决定）
  const ci2 = Math.abs(ci) < 1e-12 ? 0 : ci;
  const relLon = Math.atan2(ci2*Math.sin(u), Math.cos(u))/DEG;
  let node = lon + S.t*(360/S.rot) - relLon;
  node = ((node % 360) + 360) % 360;
  S.node = Math.round(node*10)/10;
  $('inNode').value = Math.round(S.node);
  setRAField(eastRANow());                // α 与 Ω 联动同步
  setPlaying(false);
  keepViewReadable();
  syncLabels(); syncEastInput(); syncLLInput();
}

function syncEastInput(){
  const sec = Math.round(eastClockNow()*3600) % 86400;
  $('inEastH').value = pad2(Math.floor(sec/3600));
  $('inEastM').value = pad2(Math.floor(sec%3600/60));
  $('inEastS').value = pad2(sec%60);
}
function normalizeClockField(id){
  const max = id === 'inEastH' ? 23 : 59;
  const v = clamp(parseInt($(id).value, 10) || 0, 0, max);
  $(id).value = pad2(v);
}
function syncLLInput(){
  const g = geoOf(satAt(S.t), S.t);
  const f1 = v => (Math.abs(v) < 0.05 ? 0 : v).toFixed(1);
  $('inLatT').value = f1(g.lat);
  $('inLonT').value = f1(g.lon);
}

/* 把赤经值写回输入框 */
function setRAField(v){
  $('inRA').value = ((((v % 360) + 360) % 360)).toFixed(1);
}
/* 规范化“最东点赤经”输入，并双向联动升交点赤经：α = Ω + relRA(最东点) */
function normalizeRAField(){
  const v = parseFloat(String($('inRA').value).replace(/[^\d.\-]/g,''));
  if (!isFinite(v)){ setRAField(eastRANow()); return; }
  let node = v - relRADeg(eastU());
  node = ((node % 360) + 360) % 360;
  S.node = Math.round(node*10)/10;
  if (S.node >= 360) S.node -= 360;
  $('inNode').value = Math.round(S.node);
  setRAField(eastRANow());
  syncLabels(); syncLLInput(); keepViewReadable();
}

// 3D 视角拖动 / 缩放

let last = 0;
let lastT = null;      // 上一帧的 S.t：主循环按 Δt 统一处理所有时间变化（播放/加速/定位跳变）
function loop(now){
  if (!last) last = now;
  const dt = Math.max(0, Math.min(0.08, (now-last)/1000));   // 时间只前进，绝不回退
  last = now;
  // 时间倍率：勾选「时间加速」且窗口打开时整页按同一时间基准加速
  // （太阳公转、日期、晨昏线、卫星全部共用 S.t，绝不会各走各的时间）
  const boost = (chkFast.checked && precWin.classList.contains('show')) ? 100 : 1;
  if (S.playing) S.t += dt*SPEED*boost;    // 时间连续推进，卫星周而复始，不会在循环点跳位

  /* 太阳同步卫星的 Ω 进动：按 Δt 统一处理（选中星经 S，其余星直接改各自参数）。
     nodeRate = 太阳惯性赤经变化率（°/h）：太阳日模式=0（Ω 不需进动）；恒星日模式≈+0.0411°/h */
  if (lastT === null) lastT = S.t;
  const dT = S.t - lastT;
  lastT = S.t;
  if (dT !== 0){
    const nodeRate = 360/S.rot - 15;
    if (Math.abs(nodeRate) > 1e-12){
      for (let si=0; si<SATS.length; si++){
        if (si === cur || !SATS[si].sunSync) continue;
        const s = SATS[si];
        s.node = ((s.node + nodeRate*dT) % 360 + 360) % 360;
      }
      if (S.sunSync){
        S.node = ((S.node + nodeRate*dT) % 360 + 360) % 360;
        if (document.activeElement !== $('inNode')){
          $('inNode').value = Math.round(S.node);
          $('vNode').textContent = (Number.isInteger(S.node) ? S.node : S.node.toFixed(1)) + '°';
        }
        if (document.activeElement !== $('inRA')) setRAField(eastRANow());
      }
    }
  }
  pushSToSat();                          // 滑块对选中星的修改回写到 SATS[cur]
  syncDateUI();
  const g = drawMapFrame();
  drawGlobe();
  drawPrecWin();
  // 状态文字（显示选中卫星）
  const nd = nowDate();
  statusEl.textContent = SATS[cur].tag + '  ·  北京时间 ' + fmtClock(S.t) +
    '  ·  ' + (nd.getMonth()+1) + '月' + nd.getDate() + '日' +
    '  ·  第 ' + (Math.floor(S.t/TAU_T())+1) + ' 圈' +
    '  ·  最东 ' + fmtClock(eastClockNow()) +
    '  ·  星下点 ' + Math.abs(g.lat).toFixed(1) + '°' + (g.lat>=0?'N':'S') +
    ' ' + Math.abs(g.lon).toFixed(1) + '°' + (g.lon>=0?'E':'W');
  requestAnimationFrame(loop);
}

/* ================= 预设：风云 C / D / E 三星 ================= */
/* 真实背景：FY-1C/1D 为太阳同步极轨气象卫星（≈870 km 量级），FY-3E 为太阳同步晨昏轨道。
   地球扁率 J2 摄动使太阳同步轨道面每天东进 0.9856°，恰与地球公转角速度相同
   → 过升交点地方时（LTAN）恒定，轨道与昼夜分界的相对关系不变。
   模型内太阳惯性赤经 αs = 300° + (360/S.rot − 15)·t（小时），LTAN = 12 + (Ω − αs)/15
   ⇒ 预设按下式反解 Ω = αs + (LTAN − 12)×15：C 星 LTAN 09:00、D 星 15:00、E 星 06:00。
   三星 LTAN 不同，因此「公转进动」窗口中三条轨道面交线与日地连线的夹角各不相同（颜色对应）。 */
const PRESETS = [
  { tsat:1.6, incl:97.4, ltan:9.0,  phOff:120 },   // phOff：沿轨相位错开量，
  { tsat:1.9, incl:99.5, ltan:15.0, phOff:240 },   // 避免三星（尤其极轨）同时挤在极区
  { tsat:1.7, incl:98.8, ltan:6.0,  phOff:0  }     // E 星保持「此刻位于最东点」
];
/* 本模型的太阳惯性赤经（°）：太阳日模式恒为 300°，恒星日模式每天东进 0.9856° */
function alphaSunNow(){ return 300 + (360/S.rot - 15)*S.t; }

/* 选中星切换：S 与 SATS[cur] 双向镜像；滑块/定位框始终编辑选中星 */
function pushSToSat(){
  const s = SATS[cur];
  s.tsat = S.tsat; s.incl = S.incl; s.node = S.node; s.phase = S.phase; s.sunSync = S.sunSync;
}
function loadSatToS(i){
  pushSToSat();
  cur = i;
  const s = SATS[i];
  S.tsat = s.tsat; S.incl = s.incl; S.node = s.node; S.phase = s.phase; S.sunSync = s.sunSync;
  $('inTsat').value = S.tsat; $('inIncl').value = S.incl; $('inNode').value = Math.round(S.node);
  setRAField(eastRANow());
  syncLabels(); syncEastInput(); syncLLInput();
  keepViewReadable();
  syncChips();
}

/* 显示开关 / 预设高亮 / 图例颜色 */
function syncChips(){
  document.querySelectorAll('#satRow .chip').forEach(ch=>{
    const i = +ch.dataset.i, s = SATS[i];
    ch.classList.toggle('on', s.show);
    ch.classList.toggle('sel', i === cur);
    ch.querySelector('i').style.background = s.show ? s.mapCol : '#c4c4ca';
  });
  const pm = {btnFYC:0, btnFYD:1, btnFY:2};
  document.querySelectorAll('.preset .pbtn').forEach(b=>{
    const i = pm[b.id], P = PRESETS[i], sp = SATS[i];
    // 只有「选中星」当前参数确实等于该预设时才高亮（避免默认通用轨道被误认为已套用预设）
    b.classList.toggle('sel', i === cur && P &&
      Math.abs(sp.tsat - P.tsat) < 1e-6 && Math.abs(sp.incl - P.incl) < 1e-6);
  });
  const dot = $('lgDot'), ln = $('lgLine');
  if (dot) dot.style.background = SATS[cur].mapCol;
  if (ln) ln.style.background = showOrbits ? SATS[cur].mapCol : '#c8c8cc';
}

/* 应用某星预设：载入参数 → 定位到当前时刻最东点 → 显示并选中 → 打开进动窗口 */
function applyPreset(i){
  const s = SATS[i], P = PRESETS[i];
  s.tsat = P.tsat; s.incl = P.incl; s.sunSync = true;
  s.node = ((alphaSunNow() + (P.ltan - 12)*15) % 360 + 360) % 360;
  s.phase = (((90 + P.phOff - TAU*S.t/tauTs(s)/DEG) % 360) + 360) % 360;  // 在最东点基础上按 phOff 错开
  SATS.forEach((x,k)=>{ x.show = (k === i); });     // 预设＝该星独立显示（多星同显用下方开关叠加）
  loadSatToS(i);
  $('inTsat').value = s.tsat; $('inIncl').value = s.incl; $('inNode').value = Math.round(s.node);
  setRAField(eastRANow());
  syncChips();
  openPrecWin();                      // 自动打开“公转进动”演示窗口
}
$('btnFYC').addEventListener('click', ()=> applyPreset(0));
$('btnFYD').addEventListener('click', ()=> applyPreset(1));
$('btnFY').addEventListener('click',  ()=> applyPreset(2));

/* 卫星显示开关：至少保留一颗可见；点亮的星同时成为选中星 */
document.querySelectorAll('#satRow .chip').forEach(ch=>{
  ch.addEventListener('click', ()=>{
    const i = +ch.dataset.i, s = SATS[i];
    if (s.show && SATS.filter(x=>x.show).length <= 1) return;   // 至少保留一颗
    s.show = !s.show;
    if (s.show) loadSatToS(i);
    else if (cur === i){
      const nx = SATS.findIndex(x=>x.show);
      if (nx >= 0) loadSatToS(nx); else syncChips();
    } else syncChips();
  });
});

/* 「轨道线」开关：只隐藏平面图中的地面轨迹线（卫星位置标记保留） */
let showOrbits = true;
$('chkOrb').addEventListener('change', e=>{ showOrbits = e.target.checked; syncChips(); });
syncChips();

/* 非太阳同步卫星的 J2 摄动结点漂移率（°/天，负值＝西退），进动窗口中展示 */
function j2Rate(s){
  const a = 6378.137*Math.cbrt(398600.4418*Math.pow(s.tsat*3600/TAU,2)/Math.pow(6378.137,3));
  return -9.9640*Math.pow(6378.137/a,3.5)*Math.cos(s.incl*DEG);
}

/* ================= 浮动窗口：地球公转 · 轨道面进动 ================= */
const precWin = document.getElementById('precWin');
const precInfo = document.getElementById('precInfo');
const chkFast = document.getElementById('chkFast');
/* 窗口挂到 body 下：position:fixed 定位，可自由拖到左侧平面图/任意位置显示，
   不再被 #right 的 overflow:hidden 裁剪，也不受 3D 面板尺寸限制 */
document.body.appendChild(precWin);
const pcv = document.getElementById('prec'), pctx = pcv.getContext('2d');
const PC_W = 284, PC_H = 200;
const dpr2 = Math.min(2, window.devicePixelRatio || 1);
pcv.width = PC_W*dpr2; pcv.height = PC_H*dpr2;
pcv.style.width = PC_W+'px'; pcv.style.height = PC_H+'px';
const SUN_RATE = 0.9856;              // 地球公转角速度（°/天）＝太阳同步轨道面的进动速率
const SUN_EPOCH = new Date(2020,0,1).getTime();
/* 四季方位（北半球）：视角固定为「北极上空垂直俯视黄道面」，
   于是屏幕 上=春分、左=夏至、下=秋分、右=冬至，地球沿屏幕逆时针公转。
   相位零点取「春分」当天的公转角；此后地球沿逆时针方向公转（从黄道面北侧俯视，与常识一致），
   于是节气当天地球正好落在对应刻度上 —— 日期、晨昏线、进动三者始终自洽
   数组按时间顺序排列：春分 → 夏至 → 秋分 → 冬至（ph = 自春分起逆时针转过的公转角） */
const TH_SPRING = SUN_RATE * ((new Date(2020,2,20,12).getTime() - SUN_EPOCH)/86400000);
const SEASONS = [{name:'春分', ph:0}, {name:'夏至', ph:90}, {name:'秋分', ph:180}, {name:'冬至', ph:270}];

/* ===== 窗口内的 3D 场景：相机在黄道面正上方（北极方向）垂直俯视 =====
   世界坐标：x 向右、y 指向黄道北、z 指向观察者；黄道面 = y=0 平面
   秋分点在地球轨道的 +z 端（屏幕下方），春分点在最远的 -z 端（屏幕上方） */
const VIEW_EL0 = 90*DEG;                                  // 视角高度：90° = 正俯视（北天极方向）
const ORB_R = 86;                                         // 公转轨道半径（逻辑像素）
let viewAz = 0;                                           // 水平方位角（0 = 春分在上、秋分在下）
let viewEl = VIEW_EL0;                                    // 视角高度（固定，不接受鼠标调整）
const SEASON_OFF = 26;                                    // 节气刻度文字外推距离（逻辑像素，未缩放）
let pZoom = 1;                                            // 场景整体缩放（俯视时按画布高度自动缩小）
let pFlat = 1;                                            // |sin 视角高度|：1=正俯视，0=几乎与轨道面共面
let pvD = [0,0,1], pvR = [1,0,0], pvU = [0,1,0];          // 相机基（每帧由下面重算）
function updateViewBasis(){
  const ce = Math.cos(viewEl), se = Math.sin(viewEl);
  const ca = Math.cos(viewAz), sa = Math.sin(viewAz);
  pvD = [ sa*ce, se, ca*ce ];                              // 场景 → 相机
  pvR = [ ca, 0, -sa ];                                    // 屏幕向右
  pvU = [ -sa*se, ce, -ca*se ];                            // 屏幕向上
  pFlat = Math.abs(se);
  /* 轨道投影是半轴 a=ORB_R·pZoom（横向）、b=a·|sin 视角高度|（纵向）的椭圆。
     纵向/横向都留出 SEASON_OFF 外推的节气文字位置，取更紧的一侧整体缩放，保证连同文字不出画 */
  pZoom = Math.min(1,
    (PC_H/2 - 16) / (ORB_R*pFlat + SEASON_OFF),
    (PC_W/2 - 30) / (ORB_R + SEASON_OFF));
}
updateViewBasis();

/* 世界坐标（单位＝逻辑像素，也用于方向向量）→ 屏幕坐标（正交投影） */
function pScreen(P, cx, cy){
  return [cx + pZoom*(P[0]*pvR[0] + P[1]*pvR[1] + P[2]*pvR[2]),
          cy - pZoom*(P[0]*pvU[0] + P[1]*pvU[1] + P[2]*pvU[2])];
}
/* 公转角 pr（弧度，自春分起逆时针）处、半径 r 的轨道点：
   春分 pr=0 在 -z（远）、夏至 pr=90° 在 -x（左）、秋分 pr=180° 在 +z（近）、冬至 pr=270° 在 +x（右） */
function orbPos(pr, r){ return [-r*Math.sin(pr), 0, -r*Math.cos(pr)]; }
/* 连续天数（跨年不回卷）：窗口里的太阳位置、公转角全部由它算，
   而它直接取自 nowDate() —— 即窗口与日期共用同一个时间基准 */
function sunDay(){ return (nowDate().getTime() - SUN_EPOCH)/86400000; }

function openPrecWin(){ precWin.classList.add('show'); }
$('btnPrec').addEventListener('click', ()=>{
  precWin.classList.toggle('show');
});
$('btnPrecClose').addEventListener('click', ()=> precWin.classList.remove('show'));

/* 窗口缩放：内部坐标系恒为 PC_W×PC_H，按 precScale 放大渲染（矢量清晰不模糊） */
let precScale = 1;
function applyPrecSize(){
  const w = Math.round(PC_W*precScale), h = Math.round(PC_H*precScale);
  pcv.width = Math.round(w*dpr2); pcv.height = Math.round(h*dpr2);
  pcv.style.width = w+'px'; pcv.style.height = h+'px';
}
/* 标题栏拖动窗口 / 右下角手柄缩放（窗口在 body 上，可拖到任意位置：3D 区、平面图区都能正常显示） */
(function(){
  const head = precWin.querySelector('.phead');
  function begin(ev){
    const r = precWin.getBoundingClientRect();          // fixed 定位 → 直接就是视口坐标
    return { sx: ev.clientX, sy: ev.clientY,
             ox: r.left, oy: r.top, s0: precScale };
  }
  function keepInside(){                                 // 保证整窗留在视口内
    if (!precWin.style.left) return;
    const w = precWin.offsetWidth, h = precWin.offsetHeight;
    precWin.style.left = clamp(parseFloat(precWin.style.left), 0, Math.max(0, window.innerWidth  - w)) + 'px';
    precWin.style.top  = clamp(parseFloat(precWin.style.top ), 0, Math.max(0, window.innerHeight - h)) + 'px';
  }
  function dockHome(){                                   // 双击标题栏：回到 3D 面板右上角
    precWin.style.left = 'auto'; precWin.style.top = ''; precWin.style.right = '12px';
  }
  function bindMove(up2, move){
    const mv = e=>{ move(e); };
    const up = ()=>{ document.body.style.cursor='';
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up); up2(); };
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
  }
  head.addEventListener('pointerdown', ev=>{
    if (ev.target.tagName === 'BUTTON') return;
    const st = begin(ev);
    precWin.style.right = 'auto';
    precWin.style.left = st.ox+'px'; precWin.style.top = st.oy+'px';
    document.body.style.cursor = 'move';
    bindMove(()=>{}, e=>{
      const w = precWin.offsetWidth, h = precWin.offsetHeight;
      precWin.style.left = clamp(st.ox + e.clientX - st.sx, 0, Math.max(0, window.innerWidth  - w)) + 'px';
      precWin.style.top  = clamp(st.oy + e.clientY - st.sy, 0, Math.max(0, window.innerHeight - h)) + 'px';
    });
    ev.preventDefault();
  });
  head.addEventListener('dblclick', ev=>{
    if (ev.target.tagName === 'BUTTON') return;
    dockHome();
  });
  $('precRsz').addEventListener('pointerdown', ev=>{
    const st = begin(ev);
    document.body.style.cursor = 'nwse-resize';
    bindMove(()=>{}, e=>{
      precScale = clamp(st.s0 + (e.clientX - st.sx)/PC_W, 0.75, 2.4);
      precWin.style.width = Math.round(PC_W*precScale + 24) + 'px';
      applyPrecSize();
      keepInside();                                       // 放大后若超出右/下边界，自动拉回可视范围
    });
    ev.preventDefault();
  });
  window.addEventListener('resize', keepInside);
})();

/* 视角固定为「北极上空俯视」标准取景：不支持鼠标旋转 ——
   这样节气方位（上春分 / 下秋分 / 左夏至 / 右冬至）与地理常识始终一一对应，
   在画面上拖动也不会误改视角。窗口自身的拖动/缩放仍由标题栏与右下角手柄处理。 */
pcv.style.touchAction = 'auto';
pcv.style.cursor = 'default';
pcv.title = '北极上空俯视黄道面：上=春分、下=秋分、左=夏至、右=冬至';

/* 浮动窗口里的 3D 地球：与主 3D 地球同一套模型
   （海面径向渐变 + 细经纬网 + 海岸线 + 昼夜月牙 + 直射点），只是半径小很多。
   地轴在惯性系中固定指向 n=(sin23.44°, cos23.44°, 0)：北极永远偏向屏幕右侧，
   所以地球跑到太阳左边（夏至）时北极朝太阳、跑到右边（冬至）时背对太阳 —— 四季由此而来。 */
function drawPrecGlobe(c, gx, gy, gR, sunD, spinDeg){
  const EPS = 23.44*DEG;
  const n  = [Math.sin(EPS), Math.cos(EPS), 0];           // 地轴（指向北极）
  const Xw = [1,0,0];
  const a1 = norm3([Xw[0]-n[0]*dot3(Xw,n), Xw[1]-n[1]*dot3(Xw,n), Xw[2]-n[2]*dot3(Xw,n)]);
  const a2 = cross3(n, a1);
  const sp = spinDeg*DEG;
  const dir = (lat, lon)=>{
    const ca = Math.cos(lat*DEG), sa = Math.sin(lat*DEG);
    const co = Math.cos(lon*DEG + sp), so = Math.sin(lon*DEG + sp);
    return [ ca*co*a1[0] + ca*so*a2[0] + sa*n[0],
             ca*co*a1[1] + ca*so*a2[1] + sa*n[1],
             ca*co*a1[2] + ca*so*a2[2] + sa*n[2] ];
  };
  // 单位方向 → 球面屏幕坐标（正交投影，第三分量 >0 表示朝向观察者）
  const pj = p => [ gx + gR*(p[0]*pvR[0] + p[1]*pvR[1] + p[2]*pvR[2]),
                    gy - gR*(p[0]*pvU[0] + p[1]*pvU[1] + p[2]*pvU[2]),
                    dot3(p, pvD) ];
  // 只画朝向观察者的一段（在地平线处精确截断），与主 3D 的 strokeDirs 同一套做法
  function strokeDirs(pts, color, lw){
    c.strokeStyle = color; c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath();
    let pp = null, pv = false;
    for (let i=0;i<pts.length;i++){
      const q = pj(pts[i]), v = q[2] >= 0;
      if (v){
        if (!pp || !pv){
          if (pp && !pv){
            const f = pp[2]/(pp[2]-q[2]);
            c.moveTo(pp[0]+(q[0]-pp[0])*f, pp[1]+(q[1]-pp[1])*f);
            c.lineTo(q[0], q[1]);
          } else c.moveTo(q[0], q[1]);
        } else c.lineTo(q[0], q[1]);
      } else if (pp && pv){
        const f = pp[2]/(pp[2]-q[2]);
        c.lineTo(pp[0]+(q[0]-pp[0])*f, pp[1]+(q[1]-pp[1])*f);
      }
      pp = q; pv = v;
    }
    c.stroke();
  }

  // ---- 海面：受光点朝太阳那一侧（与主 3D 相同的四段渐变） ----
  const hsx = dot3(sunD, pvR), hsy = dot3(sunD, pvU);
  const hn  = Math.hypot(hsx, hsy) || 1;
  const grd = c.createRadialGradient(
    gx + gR*0.34*(hsx/hn), gy - gR*0.38*(hsy/hn), gR*0.03, gx, gy, gR*1.03);
  grd.addColorStop(0,'#eef7ff');
  grd.addColorStop(0.30,'#c6dff4');
  grd.addColorStop(0.68,'#88b0d4');
  grd.addColorStop(1,'#4a7095');
  c.beginPath(); c.arc(gx, gy, gR, 0, TAU); c.fillStyle = grd; c.fill();

  c.save();
  c.beginPath(); c.arc(gx, gy, gR, 0, TAU); c.clip();

  // ---- 经纬网（正面；线细，小图上不喧宾夺主） ----
  for (let lat=-60; lat<=60; lat+=30){
    const pts = []; for (let lon=-180; lon<=180; lon+=6) pts.push(dir(lat, lon));
    strokeDirs(pts, 'rgba(20,44,92,.45)', 0.45);
  }
  for (let lon=-180; lon<180; lon+=45){
    const pts = []; for (let lat=-90; lat<=90; lat+=5) pts.push(dir(lat, lon));
    strokeDirs(pts, 'rgba(20,44,92,.38)', 0.45);
  }

  // ---- 海岸线（世界地图数据，与主 3D 地球同一份；球小，隔点取样） ----
  for (let r=0; r<WORLD.length; r++){
    const ring = WORLD[r], nn = ring.length/2;
    const step = nn > 240 ? 3 : (nn > 90 ? 2 : 1);
    const pts = [];
    for (let i=0;i<nn;i+=step) pts.push(dir(ring[i*2+1], ring[i*2]));
    if (nn > 1) pts.push(dir(ring[1], ring[0]));          // 补上闭合点
    strokeDirs(pts, 'rgba(28,66,132,.92)', 0.42);
  }

  // ---- 昼夜：夜面用「晨昏线正面弧 + 球缘夜侧弧」围成的月牙覆盖 ----
  const NIGHT = 'rgba(9,14,34,.55)';
  if (showDN){
    const dc = dot3(pvD, sunD);
    if (dc <= -0.999){
      c.beginPath(); c.arc(gx, gy, gR, 0, TAU); c.fillStyle = NIGHT; c.fill();
    } else if (dc < 0.999){
      const Nv = cross3(pvD, sunD);
      if (Math.hypot(Nv[0],Nv[1],Nv[2]) > 1e-9){
        const A = norm3(cross3(sunD, Nv)), B = cross3(sunD, A);
        const M = 48, tPts = [], lPts = [];
        const aP = Math.atan2(dot3(B,pvD), dot3(A,pvD));
        for (let k=0;k<=M;k++){
          const a = aP - Math.PI/2 + Math.PI*k/M;
          tPts.push([Math.cos(a)*A[0]+Math.sin(a)*B[0],
                     Math.cos(a)*A[1]+Math.sin(a)*B[1],
                     Math.cos(a)*A[2]+Math.sin(a)*B[2]]);
        }
        const psiM = Math.atan2(dot3(pvU,sunD), dot3(pvR,sunD));
        for (let k=0;k<=M;k++){
          const ps = psiM + Math.PI/2 + Math.PI*k/M;
          lPts.push([Math.cos(ps)*pvR[0]+Math.sin(ps)*pvU[0],
                     Math.cos(ps)*pvR[1]+Math.sin(ps)*pvU[1],
                     Math.cos(ps)*pvR[2]+Math.sin(ps)*pvU[2]]);
        }
        const tEnd = tPts[tPts.length-1];
        const d0 = (lPts[0][0]-tEnd[0])**2 + (lPts[0][1]-tEnd[1])**2 + (lPts[0][2]-tEnd[2])**2;
        const d1 = (lPts[M][0]-tEnd[0])**2 + (lPts[M][1]-tEnd[1])**2 + (lPts[M][2]-tEnd[2])**2;
        const limb = d0 <= d1 ? lPts : lPts.slice().reverse();
        c.beginPath();
        tPts.concat(limb).forEach((p,kk)=>{
          const q = pj(p);
          kk ? c.lineTo(q[0],q[1]) : c.moveTo(q[0],q[1]);
        });
        c.closePath();
        c.fillStyle = NIGHT; c.fill();
        c.beginPath();                                    // 晨昏线
        tPts.forEach((p,kk)=>{
          const q = pj(p);
          kk ? c.lineTo(q[0],q[1]) : c.moveTo(q[0],q[1]);
        });
        c.strokeStyle = 'rgba(255,232,160,.5)'; c.lineWidth = 0.8; c.stroke();
      }
    }
  }

  // ---- 太阳直射点（正对太阳的那一点） ----
  if (showDN && dot3(sunD, pvD) > 0.14){                 // 太靠边缘就不画，免得像球外的星点
    const q = pj(sunD);
    const g2 = c.createRadialGradient(q[0],q[1],0.4, q[0],q[1],gR*0.36);
    g2.addColorStop(0,'rgba(255,248,200,.95)');
    g2.addColorStop(0.4,'rgba(255,206,80,.5)');
    g2.addColorStop(1,'rgba(255,190,60,0)');
    c.fillStyle = g2; c.beginPath(); c.arc(q[0],q[1],gR*0.36,0,TAU); c.fill();
    c.beginPath(); c.arc(q[0],q[1],Math.max(1.3, gR*0.13),0,TAU);
    c.fillStyle = '#fff8d6'; c.fill();
  }
  c.restore();

  c.strokeStyle = 'rgba(178,212,240,.55)'; c.lineWidth = 0.8;   // 球缘
  c.beginPath(); c.arc(gx, gy, gR, 0, TAU); c.stroke();
}

function drawPrecWin(){
  if (!precWin.classList.contains('show')) return;
  const c = pctx, font = '"Segoe UI","Microsoft YaHei",sans-serif';
  c.setTransform(dpr2*precScale,0,0,dpr2*precScale,0,0);
  c.clearRect(0,0,PC_W,PC_H);
  const cx = PC_W/2, cy = PC_H/2, Rorb = ORB_R;          // 正俯视：上下对称取中
  const D = sunDay();                                 // 连续天数，直接由当前日期换算
  const ph = SUN_RATE*D - TH_SPRING;                  // 相对「春分」逆时针转过的公转角（°），随时间增大
  const thN = ((ph % 360) + 360) % 360;               // 归一化：0°=春分、90°=夏至、180°=秋分、270°=冬至
  const pr = ph*DEG;
  c.lineCap = 'round';

  /* ---------- 地球在轨道上的 3D 位置 ---------- */
  const E3 = orbPos(pr, Rorb);                        // 世界坐标（黄道面内）
  const exy = pScreen(E3, cx, cy);
  const ex = exy[0], ey = exy[1];
  const depth = dot3(E3, pvD)/Rorb;                   // +1 最靠近相机 … -1 最远（正俯视时恒为 0）
  const eR = Math.max(9, 16*pZoom)*(1 + 0.11*depth);                   // 斜侧视角时近处略大、远处略小，增强立体感
  const sunD = [-E3[0]/Rorb, 0, -E3[2]/Rorb];         // 地球 → 太阳（单位向量）

  /* ---------- 惯性参考方向：世界 +x 轴（屏幕上始终水平） ---------- */
  c.strokeStyle = 'rgba(165,175,185,.30)'; c.lineWidth = 1; c.setLineDash([3,4]);
  c.beginPath(); c.moveTo(cx-Rorb-6, cy); c.lineTo(cx+Rorb+6, cy); c.stroke();
  c.setLineDash([]);

  /* ---------- 公转轨道：斜侧视角时远侧暗、近侧亮，形成 3D 纵深 ----------
     正俯视（北极上空）时轨道投影成正圆、没有远近之分，整圈用同一亮度 */
  const arcSeg = (p0,p1,color,lw)=>{
    c.strokeStyle = color; c.lineWidth = lw; c.setLineDash([4,4]);
    c.beginPath();
    for (let k=0;k<=40;k++){
      const p = pScreen(orbPos(p0 + (p1-p0)*k/40, Rorb), cx, cy);
      k ? c.lineTo(p[0],p[1]) : c.moveTo(p[0],p[1]);
    }
    c.stroke(); c.setLineDash([]);
  };
  if (pFlat > 0.995){
    arcSeg(0, TAU, 'rgba(170,186,208,.58)', 1.1);                                    // 正俯视：整圈同亮
  } else {
    // 景深 = -cos(pr - az)：随视角方位角旋转，远侧永远偏暗、近侧偏亮
    arcSeg(viewAz - Math.PI/2, viewAz + Math.PI/2, 'rgba(140,155,175,.34)', 1);      // 远侧
    arcSeg(viewAz + Math.PI/2, viewAz + Math.PI*1.5, 'rgba(168,184,205,.62)', 1.15); // 近侧
  }

  /* ---------- 四季刻度短线（画在地球之前：地球到位时正好骑在刻度上） ----------
     刻度与文字都沿「轨道投影的外法向」按固定像素偏移（正俯视时即屏幕径向），
     这样斜侧视角把纵向压扁后，纵向的刻度也不会变得又短又贴球 */
  const q = Math.floor(thN/90);                       // 当前季度：0 春分→夏至 …
  const orbPt = deg => pScreen(orbPos(deg*DEG, Rorb), cx, cy);
  /* 投影后的轨道是「轴对齐椭圆」，半轴 a=ORB_R·pZoom（横向）、b=a·sin(视角高度)（纵向）。
     刻度与文字沿该椭圆的**外法向**外推（而不是从圆心放射），低视角压扁时文字才贴着椭圆、
     不会横穿轨道或挤向中心。 */
  const EA = Rorb*pZoom, EB = Math.max(8, EA*pFlat);    // 正俯视 EB=EA → 正圆
  const radDir = deg => {
    const p = orbPt(deg), dx = p[0]-cx, dy = p[1]-cy;
    let nx = dx/(EA*EA), ny = dy/(EB*EB);
    const n = Math.hypot(nx,ny) || 1;
    return [nx/n, ny/n];
  };
  const seasonPt = (deg, off)=>{                      // 椭圆端点 + 沿法向外推 off 像素
    const p = orbPt(deg), d = radDir(deg), o = off*pZoom;
    return [p[0] + d[0]*o, p[1] + d[1]*o];
  };
  for (let k=0;k<4;k++){
    const on = (k === q), a = SEASONS[k].ph;
    const p1 = seasonPt(a, -7), p2 = seasonPt(a, 7);
    c.strokeStyle = on ? 'rgba(255,215,110,.9)' : 'rgba(160,180,205,.38)';
    c.lineWidth = on ? 1.9 : 1.3;
    c.beginPath(); c.moveTo(p1[0],p1[1]); c.lineTo(p2[0],p2[1]); c.stroke();
  }

  /* ---------- 太阳（球体：径向渐变，中心亮） ---------- */
  const sr = 11;
  const sg = c.createRadialGradient(cx-sr*0.25, cy-sr*0.3, 1, cx, cy, sr*1.9);
  sg.addColorStop(0,'#fff6d2');
  sg.addColorStop(.32,'#ffdc7a');
  sg.addColorStop(.62,'rgba(255,190,60,.55)');
  sg.addColorStop(1,'rgba(255,190,60,0)');
  c.fillStyle = sg; c.beginPath(); c.arc(cx,cy,sr*1.9,0,TAU); c.fill();
  c.fillStyle = '#ffcf5a'; c.beginPath(); c.arc(cx,cy,sr*0.62,0,TAU); c.fill();
  // 太阳标签自动避让：地球跑到下方（秋分一侧）时，标签翻到太阳上方
  const sunUp = (ey > cy + 8) && Math.abs(ex-cx) < 48;   // 地球正压在太阳下方时才翻到上方
  const sunLabY = sunUp ? cy - sr*1.9 - 2 : cy + sr*1.9 + 2;
  c.fillStyle = '#ffe9a8'; c.font = '11px '+font;
  c.textAlign = 'center'; c.textBaseline = sunUp ? 'bottom' : 'top';
  c.lineWidth = 3; c.strokeStyle = '#212327'; c.strokeText('太阳', cx, sunLabY);
  c.fillText('太阳', cx, sunLabY);

  /* ---------- 日地连线：太阳中心 → 地球边缘（黄道面内的直线，投影后仍是直线） ---------- */
  const sdx = cx-ex, sdy = cy-ey, sdn = Math.hypot(sdx,sdy) || 1;
  const ux = sdx/sdn, uy = sdy/sdn;                   // 地球 → 太阳 的屏幕单位向量
  c.strokeStyle = 'rgba(255,205,90,.85)'; c.setLineDash([5,4]); c.lineWidth = 1;
  c.beginPath();
  c.moveTo(cx - ux*sr*0.95, cy - uy*sr*0.95);
  c.lineTo(ex + ux*(eR+3), ey + uy*(eR+3));
  c.stroke(); c.setLineDash([]);

  /* ---------- 各可见卫星的轨道面与黄道面交线：过地心、躺在黄道面内，颜色对应各星 ----------
     「⊥ 日地连线」是 LTAN 06:00（晨昏轨道）的特殊情形；一般情形下交线与日地连线的夹角
     由该星的升交点地方时决定：θ = 90° − (Ω − αs)，太阳同步时恒定，非太阳同步时随时间转动 */
  const aSun = alphaSunNow();                         // 本模型的太阳惯性赤经（°）
  const satLines = [];
  for (let si=0; si<SATS.length; si++){
    const s = SATS[si]; if (!s.show) continue;
    const th = (90 - (s.node - aSun))*DEG;
    const ct = Math.cos(th), st = Math.sin(th);
    const wx = Math.cos(pr)*ct + Math.sin(pr)*st;     // ⊥日地连线方向 (cos pr, −sin pr) 旋转 th
    const wz = Math.cos(pr)*st - Math.sin(pr)*ct;
    const tS2 = pScreen([wx, 0, wz], 0, 0);
    const tL2 = Math.hypot(tS2[0], tS2[1]) || 1;
    const gx2 = tS2[0]/tL2, gy2 = tS2[1]/tL2;         // 该星交线的屏幕单位方向
    satLines.push({ s, gx:gx2, gy:gy2, sel: si===cur });
    c.strokeStyle = s.ringF; c.lineWidth = si===cur ? 1.8 : 1.25;
    c.beginPath();
    c.moveTo(ex + gx2*34*pZoom, ey + gy2*34*pZoom);
    c.lineTo(ex - gx2*34*pZoom, ey - gy2*34*pZoom);
    c.stroke();
  }

  /* ---------- 「若无进动」：惯性系中固定的 +x 方向（屏幕上水平） ---------- */
  if (Math.abs(ph) > 2){
    c.strokeStyle = 'rgba(210,215,225,.42)'; c.lineWidth = 1.2; c.setLineDash([6,5]);
    c.beginPath(); c.moveTo(ex-34*pZoom, ey); c.lineTo(ex+34*pZoom, ey); c.stroke();
    c.setLineDash([]);
  }

  /* ---------- 地球：与主 3D 相同的球体模型 ---------- */
  drawPrecGlobe(c, ex, ey, eR, sunD, -ph*2.2);

  /* ---------- 「地球」标签：8 个方向里挑最空的一个 ---------- */
  c.fillStyle = '#dfe9ff'; c.font = '11px '+font;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  const labelPts = [];
  for (let k=0;k<4;k++) labelPts.push(seasonPt(SEASONS[k].ph, SEASON_OFF));
  function epScore(p){
    let m = Math.min(p.x-15, PC_W-15-p.x, p.y-9, PC_H-9-p.y);
    for (const q2 of labelPts) m = Math.min(m, Math.hypot(p.x-q2[0], p.y-q2[1]) - 27);
    m = Math.min(m, Math.hypot(p.x-cx, p.y-cy) - 32);   // 别压住太阳
    return m;
  }
  const angSun = Math.atan2(uy, ux);                  // 地球 → 太阳 的屏幕角
  const grnRef = satLines.find(L2=>L2.sel) || satLines[0];
  const angGrn = grnRef ? Math.atan2(grnRef.gy, grnRef.gx) : angSun + Math.PI/2;
  let ep = null, ebest = -1e9;
  for (let k=0;k<8;k++){
    const a2 = k*Math.PI/4;
    const p2 = {x: ex+Math.cos(a2)*(eR+14), y: ey+Math.sin(a2)*(eR+14)};
    const s2 = epScore(p2)
      - 26*Math.pow(Math.cos(a2-angGrn),2)             // 避开绿色轨道面线（两侧都算）
      - 12*Math.pow(Math.cos(a2-angSun),2);            // 避开黄色日地连线
    if (s2 > ebest){ ebest = s2; ep = p2; }
  }
  const elx = Math.max(16, Math.min(PC_W-16, ep.x));
  const ely = Math.max(12, Math.min(PC_H-10, ep.y));
  c.lineWidth = 3; c.strokeStyle = '#212327'; c.strokeText('地球', elx, ely);   // 描边晕影：压在线上也读得清
  c.fillText('地球', elx, ely);

  /* ---------- 四季方位文字（最后画，压在最上层才读得清）：上=春分、左=夏至、下=秋分、右=冬至 ---------- */
  for (let k=0;k<4;k++){
    const s = SEASONS[k], on = (k === q);
    const p = seasonPt(s.ph, SEASON_OFF);
    c.font = '10.5px '+font;
    // 文字朝「远离圆心」的一侧排，跟随视角旋转（不再写死上下左右）
    const sdx2 = p[0]-cx, sdy2 = p[1]-cy;
    c.textAlign = sdx2 > 10 ? 'left' : (sdx2 < -10 ? 'right' : 'center');
    c.textBaseline = sdy2 > 7 ? 'top' : (sdy2 < -7 ? 'bottom' : 'middle');
    // 夹在画布内：文字朝外排时，锚点也要留出字身厚度
    let lx2 = Math.max(12, Math.min(PC_W-12, p[0]));
    let ly2 = Math.max(11, Math.min(PC_H-11, p[1]));
    if (c.textAlign === 'left')  lx2 = Math.min(lx2, PC_W-28);
    if (c.textAlign === 'right') lx2 = Math.max(lx2, 28);
    if (c.textBaseline === 'top') ly2 = Math.min(ly2, PC_H-14);
    if (c.textBaseline === 'bottom') ly2 = Math.max(ly2, 14);
    c.lineWidth = 3; c.strokeStyle = '#212327';        // 深色描边（晕影），压在其它线上也读得清
    c.strokeText(s.name, lx2, ly2);
    c.fillStyle = on ? '#ffd76e' : 'rgba(176,195,216,.78)';
    c.fillText(s.name, lx2, ly2);
  }

  /* 每颗可见卫星一行：进动速率 + 当前升交点地方时（LTAN = 12 + (Ω − αs)/15） */
  let rows = '';
  for (const L2 of satLines){
    const s = L2.s;
    const lt = (((12 + (s.node - aSun)/15) % 24) + 24) % 24;
    const ltM = Math.round(lt%1*60) % 60;
    const ltTxt = pad2(Math.floor(lt)) + ':' + pad2(ltM);
    const rate = s.sunSync ? SUN_RATE : j2Rate(s);
    const rateTxt = rate >= 0
      ? '东进 <b>' + rate.toFixed(4) + '°/天</b>'
      : '西退 <b>' + Math.abs(rate).toFixed(4) + '°/天</b>';
    rows += '<span style="color:' + s.ringF + '">━</span> <span style="color:' + s.ringF +
            ';font-weight:700">' + s.tag + '</span>　' + rateTxt +
            '　地方时 <b>' + ltTxt + '</b><br>';
  }
  precInfo.innerHTML =
    '日期 <b>' + dateStr(nowDate()) + '</b>　第 <b>' + (yearFrac(nowDate())+1).toFixed(1) +
    '</b> 天　直射点 <b>' + Math.abs(subsolarLat()).toFixed(1) + '°' +
    (subsolarLat()>=0?'N':'S') + '</b><br>' +
    '公转 <b>' + thN.toFixed(1) + '°</b>　视角 <b>90°</b>·北极上空俯视　' +
    '<span style="color:rgba(210,215,225,.7)">┄</span> 惯性固定<br>' +
    rows +
    '太阳同步：J2 摄动使轨道面每天东进 <b>0.9856°</b>＝公转角速度 → 过升交点地方时恒定';
}

/* ================= 启动 ================= */
// 支持 #tsat=24&incl=60&node=105&phase=0 形式的初始参数
try{
  const hp = new URLSearchParams(location.hash.replace(/^#/,''));
  if (hp.has('tsat'))  S.tsat  = clamp(+hp.get('tsat'),0,24);
  if (hp.has('incl'))  S.incl  = clamp(+hp.get('incl'),-180,180);
  if (hp.has('node'))  S.node  = clamp(+hp.get('node'),0,360);
  if (hp.has('phase')) S.phase = clamp(+hp.get('phase'),0,360);
  if (hp.has('t'))     S.t     = clamp(+hp.get('t'),0,2400);
  if (hp.has('date')){
    const p = hp.get('date').split('-').map(Number);
    if (p.length === 3 && p.every(isFinite)) dateBase = new Date(p[0], p[1]-1, p[2]);
  }
  $('inTsat').value = S.tsat; $('inIncl').value = S.incl;
  if (hp.has('ra')){
    const R = ((+hp.get('ra') % 360) + 360) % 360;
    S.node = ((((R - relRADeg(eastU())) % 360) + 360) % 360);       // 由最东点赤经反解
  }   // 未给 node/ra 时沿用 DEFAULTS（Ω=210°，风云E星晨昏轨道）
  $('inTsat').value = S.tsat; $('inIncl').value = S.incl;
  $('inNode').value = S.node;
  setRAField(eastRANow());              // α 与 Ω 联动显示（#ra= 参数已在上面反解 Ω）
}catch(e){}

setDefaultView();
syncLabels();

resizeAll();
syncEastInput(); syncLLInput();
syncDateUI(true);

setPlaying(true);

// #pause 打开时停在默认时刻（便于对照）
try{
  const hq = new URLSearchParams(location.hash.replace(/^#/,''));
  if (hq.has('east')) applyEastClock(parseClock(hq.get('east')));
  if (hq.has('lat') && hq.has('lon')) applyLatLon(+hq.get('lat'), +hq.get('lon'));
  if (hq.has('dn')) showDN = hq.get('dn') !== '0';
  if (hq.has('east') || hq.has('lat') || hq.has('pause')) setPlaying(false);
}catch(e){}

/* 昼夜分布开关（平面图按钮，同时控制 3D 视图） */
const btnDN = document.getElementById('btnDN');
function syncDNBtn(){
  btnDN.textContent = '昼夜分布：' + (showDN ? '开' : '关');
  btnDN.classList.toggle('off', !showDN);
}
btnDN.addEventListener('click', ()=>{ showDN = !showDN; syncDNBtn(); });
syncDNBtn();
const ro = new ResizeObserver(()=>{ if (ro._q) return; ro._q = requestAnimationFrame(()=>{ ro._q=0; resizeAll(); }); });
ro.observe(mapBox); ro.observe(document.getElementById('right'));
window.addEventListener('resize', resizeAll);
requestAnimationFrame(loop);

})();
</script>
